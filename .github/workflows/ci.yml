name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Install the template workflow
        run: cargo install --git https://github.com/earthlings-dev/template-rs.git --branch main --bin template template-cli

      # The installed command remains the single source of truth for
      # toolchains, components, targets, and every Cargo tool. The workflow
      # duplicates no tool list.
      - name: Bootstrap toolchains, components, targets, and tools
        run: template init

      # Scope -Dwarnings to the gate so it does not apply while `init` compiles
      # third-party tools from source.
      - name: template ci
        env:
          RUSTFLAGS: "-Dwarnings"
        run: template ci

  # Non-Linux legs validate the platform-dependent surface: check + the full
  # test suite everywhere, and clippy on Windows only — the workspace carries
  # real #[cfg(windows)] code (cmd-script fakes, hook installation) that Linux
  # clippy never compiles, while no macOS-specific cfg code exists (macOS
  # minutes also bill ~10x Linux; add a mac lint step when such code appears).
  # fmt / doc / audit / cq stay Linux-only — they are platform-neutral gates.
  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # rust-cache keys per-OS automatically, so each leg warms its own cache.
      - uses: Swatinem/rust-cache@v2

      - name: Install the template workflow
        run: cargo install --git https://github.com/earthlings-dev/template-rs.git --branch main --bin template template-cli

      - name: Bootstrap toolchains, components, targets, and tools
        run: template init

      - name: template check
        env:
          RUSTFLAGS: "-Dwarnings"
        run: template check

      - name: template lint (windows-only cfg surface)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: "-Dwarnings"
        run: template lint

      - name: template test-all
        env:
          RUSTFLAGS: "-Dwarnings"
        run: template test-all

  # Continuously validates the zig-linked cross-compilation pattern: every
  # default target builds from Linux, and the Windows artifact is handed to
  # cross-smoke for a native run.
  cross:
    name: cross (zigbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      # zig is the one cross tool `template init` cannot install (it is not
      # a cargo package); the maintained setup action provides it.
      - uses: mlugg/setup-zig@v2

      - name: Install the template workflow
        run: cargo install --git https://github.com/earthlings-dev/template-rs.git --branch main --bin template template-cli

      - name: Bootstrap toolchains, components, targets, and tools
        run: template init

      - name: template cross
        run: template cross

      - uses: actions/upload-artifact@v7
        with:
          name: xtask-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/xtask.exe
          retention-days: 7

      # The arm64 Windows artifact is built and retained but not smoke-run:
      # GitHub's hosted windows-11-arm runners are public-repo-only, and the
      # x86_64 smoke job already proves the zig-link pattern end to end.
      - uses: actions/upload-artifact@v7
        with:
          name: xtask-windows-gnullvm-arm64
          path: target/aarch64-pc-windows-gnullvm/release/xtask.exe
          retention-days: 7

  # Proves the zig-linked windows-gnu binary actually runs on Windows — the
  # cross pattern is validated end to end, not assumed. `--help` renders
  # before the invocation guard and exits 0.
  cross-smoke:
    name: cross-smoke (windows)
    needs: cross
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xtask-windows-gnu

      - name: Run the cross-compiled binary natively
        run: ./xtask.exe --help
